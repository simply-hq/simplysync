# Single-service deploy of the Go relay.
#
#   docker compose up -d          # start (builds the image on first run)
#   docker compose logs -f        # follow logs (incl. the secret ops path)
#   docker compose down           # stop (data persists in the named volume)
#
# All sqlite state (relay.db + -wal + -shm) lives under /data, so the single
# named volume below captures everything. The relay only ever stores ciphertext.

services:
  relay:
    build: .
    image: sbt-relay
    restart: unless-stopped
    ports:
      - "${RELAY_PORT:-4100}:4100"
    environment:
      # Set ADMIN_TOKEN to enable the ops dashboard at a secret derived path
      # (printed to the logs on startup). Leave unset to disable admin entirely.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MAX_OWNER_BYTES: "${MAX_OWNER_BYTES:-1073741824}"
    volumes:
      - relay-data:/data
    # The image is distroless (no shell), so a Docker healthcheck CMD cannot run
    # inside it. Probe externally instead: `curl http://HOST:4100/health`.

volumes:
  relay-data:
