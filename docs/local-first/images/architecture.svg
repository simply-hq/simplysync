<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 272" width="920" height="272" role="img" aria-label="Inside the engine, and what the relay sees" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Inside the engine, and what the relay sees</title>
  <desc>Writes go from insert or update into local SQLite, are sealed with AES-GCM into an encrypted outbox, and are pushed to the relay. Pulled events are decrypted, applied last-writer-wins, and written to local SQLite, which refreshes the reactive queries.</desc>
  <style>
.d-frame{fill:#f0f2f1;stroke:#d8dde1}.d-node{fill:#f7f8f6;stroke:#aeb8c2}
.d-key{fill:#e5ebfb;stroke:#2354c6}.d-title,.d-label{fill:#182231}
.d-muted{fill:#667385}.d-edge{stroke:#667385;fill:none}.d-head{fill:#667385}
.d-edge.enc{stroke:#2354c6}.d-head.enc{fill:#2354c6}.d-edge-label{fill:#465363}
.d-edge-label.enc{fill:#1745ad}
@media (prefers-color-scheme:dark){.d-frame{fill:#171f2a;stroke:#2d3948}
.d-node{fill:#111720;stroke:#566477}.d-key{fill:#1d2b50;stroke:#89a9ff}
.d-title,.d-label{fill:#f1f3f6}.d-muted{fill:#929dab}.d-edge{stroke:#929dab}
.d-head{fill:#929dab}.d-edge.enc{stroke:#89a9ff}.d-head.enc{fill:#89a9ff}
.d-edge-label{fill:#c1c8d1}.d-edge-label.enc{fill:#a9bdff}}
</style>
  <rect class="d-frame" x="12" y="12" width="676" height="248" rx="14" stroke-width="1.25"/>
  <text class="d-title" x="28" y="38" font-size="14" font-weight="650" text-anchor="start">Engine</text>
  <text class="d-muted" x="672" y="38" font-size="11.5" font-weight="400" text-anchor="end">on device · all crypto happens here</text>
  <rect class="d-frame" x="728" y="12" width="180" height="248" rx="14" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text class="d-title" x="744" y="38" font-size="14" font-weight="650" text-anchor="start">Relay</text>
  <text class="d-muted" x="892" y="38" font-size="11.5" font-weight="400" text-anchor="end">optional</text>
  <rect class="d-node" x="32" y="60" width="132" height="40" rx="10" stroke-width="1.25"/>
  <text class="d-label" x="98.0" y="84.5" font-size="13" font-weight="500" text-anchor="middle">insert / update</text>
  <rect class="d-node" x="32" y="124" width="132" height="48" rx="10" stroke-width="1.25"/>
  <text class="d-label" x="98.0" y="146.0" font-size="13" font-weight="500" text-anchor="middle">reactive queries</text>
  <text class="d-muted" x="98.0" y="162.0" font-size="11.5" font-weight="400" text-anchor="middle">refresh on change</text>
  <rect class="d-key" x="200" y="60" width="140" height="176" rx="10" stroke-width="1.25"/>
  <text class="d-label" x="270.0" y="146.0" font-size="13" font-weight="500" text-anchor="middle">Local SQLite</text>
  <text class="d-muted" x="270.0" y="162.0" font-size="11.5" font-weight="400" text-anchor="middle">source of truth</text>
  <rect class="d-node" x="376" y="60" width="132" height="40" rx="10" stroke-width="1.25"/>
  <text class="d-label" x="442.0" y="84.5" font-size="13" font-weight="500" text-anchor="middle">seal · AES-GCM</text>
  <rect class="d-node" x="544" y="60" width="128" height="40" rx="10" stroke-width="1.25"/>
  <text class="d-label" x="608.0" y="84.5" font-size="13" font-weight="500" text-anchor="middle">encrypted outbox</text>
  <rect class="d-node" x="376" y="196" width="132" height="40" rx="10" stroke-width="1.25"/>
  <text class="d-label" x="442.0" y="220.5" font-size="13" font-weight="500" text-anchor="middle">apply · LWW</text>
  <rect class="d-node" x="544" y="196" width="128" height="40" rx="10" stroke-width="1.25"/>
  <text class="d-label" x="608.0" y="220.5" font-size="13" font-weight="500" text-anchor="middle">decrypt</text>
  <rect class="d-node" x="748" y="60" width="140" height="176" rx="10" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text class="d-label" x="818.0" y="146.0" font-size="13" font-weight="500" text-anchor="middle">event store</text>
  <text class="d-muted" x="818.0" y="162.0" font-size="11.5" font-weight="400" text-anchor="middle">ciphertext only</text>
  <polyline class="d-edge" points="164,80 193,80" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon class="d-head" points="200,80 191,84.5 191,75.5"/>
  <polyline class="d-edge" points="340,80 369,80" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon class="d-head" points="376,80 367,84.5 367,75.5"/>
  <polyline class="d-edge enc" points="508,80 537,80" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon class="d-head enc" points="544,80 535,84.5 535,75.5"/>
  <polyline class="d-edge enc" points="672,80 741,80" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon class="d-head enc" points="748,80 739,84.5 739,75.5"/>
  <text class="d-edge-label enc" x="710" y="72" font-size="11.5" font-weight="500" text-anchor="middle">push</text>
  <polyline class="d-edge enc" points="748,216 679,216" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon class="d-head enc" points="672,216 681,211.5 681,220.5"/>
  <text class="d-edge-label enc" x="710" y="208" font-size="11.5" font-weight="500" text-anchor="middle">pull</text>
  <polyline class="d-edge" points="544,216 515,216" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon class="d-head" points="508,216 517,211.5 517,220.5"/>
  <polyline class="d-edge" points="376,216 347,216" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon class="d-head" points="340,216 349,211.5 349,220.5"/>
  <polyline class="d-edge" points="200,148 171,148" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon class="d-head" points="164,148 173,143.5 173,152.5"/>
</svg>
