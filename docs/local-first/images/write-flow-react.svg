<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 228" width="840" height="228" role="img" aria-label="A write, and a remote change, flowing through the engine" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A write, and a remote change, flowing through the engine</title>
  <desc>engine.insert writes the row + pending intent and the UI updates instantly. Asynchronously the change becomes an async AES-GCM seal, goes to the encrypted outbox and on to the relay. Changes from other devices are pulled from the relay, decrypted, applied last-writer-wins, and the UI updates again.</desc>
  <style>
.d-frame{fill:#f0f2f1;stroke:#d8dde1}.d-node{fill:#f7f8f6;stroke:#aeb8c2}
.d-key{fill:#e5ebfb;stroke:#2354c6}.d-title,.d-label{fill:#182231}
.d-muted{fill:#667385}.d-edge{stroke:#667385;fill:none}.d-head{fill:#667385}
.d-edge.enc{stroke:#2354c6}.d-head.enc{fill:#2354c6}.d-edge-label{fill:#465363}
.d-edge-label.enc{fill:#1745ad}
@media (prefers-color-scheme:dark){.d-frame{fill:#171f2a;stroke:#2d3948}
.d-node{fill:#111720;stroke:#566477}.d-key{fill:#1d2b50;stroke:#89a9ff}
.d-title,.d-label{fill:#f1f3f6}.d-muted{fill:#929dab}.d-edge{stroke:#929dab}
.d-head{fill:#929dab}.d-edge.enc{stroke:#89a9ff}.d-head.enc{fill:#89a9ff}
.d-edge-label{fill:#c1c8d1}.d-edge-label.enc{fill:#a9bdff}}
</style>
  <rect class="d-node" x="12" y="16" width="168" height="44" rx="10" stroke-width="1.25"/>
