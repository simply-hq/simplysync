  <text class="d-label" x="561.0" y="118.5" font-size="13" font-weight="500" text-anchor="middle">encrypted outbox</text>
  <rect class="d-node" x="686" y="92" width="140" height="120" rx="10" stroke-width="1.25" stroke-dasharray="6 5"/>
  <text class="d-label" x="756.0" y="150.0" font-size="13" font-weight="500" text-anchor="middle">relay</text>
  <text class="d-muted" x="756.0" y="166.0" font-size="11.5" font-weight="400" text-anchor="middle">optional</text>
