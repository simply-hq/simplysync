  <text class="d-label" x="561.0" y="36.0" font-size="13" font-weight="500" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">useQuery</text>
  <text class="d-muted" x="561.0" y="52.0" font-size="11.5" font-weight="400" text-anchor="middle">re-renders</text>
