name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  bun:
    name: Typecheck + tests (Bun workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The BIP39 guard scans every reachable commit, not only the tip.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9" # keep in sync with "packageManager" in package.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/relay-go/go.mod
          cache-dependency-path: apps/relay-go/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run security:bip39
      - run: bun run typecheck
      # The conformance suite builds the real Go relay inside a timed hook.
      # Warm the toolchain, module, and compiler caches outside that hook so a
      # clean runner does not spend the whole deadline downloading Go/sqlite.
      - run: go build ./...
        working-directory: apps/relay-go
      - run: bun run test

  go-relay:
    name: Go relay (build + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/relay-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/relay-go/go.mod
          cache-dependency-path: apps/relay-go/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  kotlin:
    name: Kotlin port (JVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/simplysync-android-kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
